# ---------- Server ----------
server.port=1234

# ---------- MySQL connection ----------
# Format: ${ENVIRONMENT_VARIABLE:default value}
# If the environment variable is not set, the default after the colon is used.
# EASIEST WAY: change the default password below (the part after "DB_PASSWORD:").
server.port=1234

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:pollpulse}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
