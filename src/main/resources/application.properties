# ---------- Server ----------
server.port=${PORT:10000}

# ---------- MySQL connection ----------
# Format: ${ENVIRONMENT_VARIABLE:default value}
# If the environment variable is not set, the default after the colon is used.
# EASIEST WAY: change the default password below (the part after "DB_PASSWORD:").
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/pollpulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Jimin@123}
